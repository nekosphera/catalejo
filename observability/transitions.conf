# State-transition log for the data space protocol state machines.
#
# The participant agent's state machines live in the connector, and the console
# drives them from the browser: every catalogue publication, contract
# negotiation and transfer request crosses this proxy as
# /api/<connector>/management/v3/<resource>. Until now the only record was the
# general access log, undifferentiated, rotated on the distribution's default
# and readable only as text.
#
# Requirement Req.-BB-PT-011 of the DSSC self-assessments asks whether the
# participant agent logs state transition requests, successes and failures for
# cataloging, contract negotiation and the transfer process. A request is the
# request; the status is the success or the failure. This writes them as one
# JSON object per line, classified by state machine, to a file with a declared
# retention of its own.
#
# Installed into /etc/nginx/conf.d by tools/install_transition_log.sh, which is
# run by the deployment. No virtual host is edited: none of them declares an
# access_log, so this http-level directive applies to all of them, and the
# condition keeps everything that is not a management call out of the file.

# Which connector the request was addressed to.
map $uri $dataspace_connector {
    default "";
    "~^/api/(?<connector_id>[A-Za-z0-9._-]+)/management/" $connector_id;
}

# Which state machine it belongs to. First match wins, so the order is the
# order of these three; anything else classifies as empty and is not logged.
map $uri $dataspace_process {
    default "";
    "~^/api/[^/]+/management/v[0-9]+/(assets|policydefinitions|contractdefinitions|catalog)" "cataloging";
    "~^/api/[^/]+/management/v[0-9]+/(contractnegotiations|negotiations)" "contract-negotiation";
    "~^/api/[^/]+/management/v[0-9]+/(transferprocesses|transfers)" "transfer-process";
}

# A transition that was requested and refused is exactly what the requirement
# asks to keep, so a failure is recorded rather than dropped.
map $status $dataspace_outcome {
    default "failure";
    "~^[23]" "success";
}

map $dataspace_process $dataspace_loggable {
    ""      0;
    default 1;
}

log_format dataspace_transitions escape=json
    '{"time":"$time_iso8601",'
    '"connector":"$dataspace_connector",'
    '"process":"$dataspace_process",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"outcome":"$dataspace_outcome",'
    '"duration_seconds":$request_time,'
    '"bytes":$body_bytes_sent,'
    '"request_id":"$request_id"}';

# Outside /var/log/nginx on purpose: the distribution's own rule rotates that
# directory on its own schedule, and two rules over one file is an error
# logrotate reports and then skips. This file has its own retention.
access_log /var/log/dataspace/transitions.log dataspace_transitions if=$dataspace_loggable;
