services:
  # The catalogue store.
  #
  # Pinned by digest, and worth reading the note in the README before bumping
  # it: there is no Apache-published Fuseki image. This is the community image
  # this project runs in production, whose last publication was July 2024. The
  # tag and the digest happen to agree today because nobody has pushed since,
  # which is luck rather than policy - hence the digest.
  fuseki:
    image: stain/jena-fuseki@sha256:b1d0c96f19adddef417520184471ac816cf36c6e72936a88ea02b29f4305929a
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?set FUSEKI_ADMIN_PASSWORD}
      FUSEKI_DATASET_1: ${FUSEKI_DATASET:-catalogue}
    ports:
      - "127.0.0.1:3030:3030"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3030/$$/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The federator: reads the catalogue of each connector and keeps the graph
  # in step with it, writing only what changed.
  federator:
    image: alpine:3.22.1
    depends_on:
      fuseki:
        condition: service_healthy
    working_dir: /catalejo
    volumes:
      - .:/catalejo:ro
    # So a connector reachable on the host - a stub during the smoke test, a
    # port-forward while you try this out - can be named from inside.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FEDERATION_INTERVAL_SECONDS: ${FEDERATION_INTERVAL_SECONDS:-900}
      FEDERATION_FETCH_RETRIES: "5"
      FEDERATION_FETCH_RETRY_DELAY_SECONDS: "2"
      FEDERATION_PUBLISH_EMPTY_CATALOG: "false"
      FEDERATION_ENSURE_SERVICE_ACCOUNT_READ_ROLE: "false"
      FUSEKI_BASE_URL: http://fuseki:3030
      FUSEKI_DATASET: ${FUSEKI_DATASET:-catalogue}
      FUSEKI_ADMIN_USER: admin
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?set FUSEKI_ADMIN_PASSWORD}
      # One connector to start with. The script reads as many as are declared.
      CONNECTOR1_NAME: ${CONNECTOR1_NAME:?set CONNECTOR1_NAME}
      CONNECTOR1_URL: ${CONNECTOR1_URL:?set CONNECTOR1_URL}
      CONNECTOR1_CLIENT_ID: ${CONNECTOR1_CLIENT_ID:-catalogue-reader}
      CONNECTOR1_CLIENT_SECRET: ${CONNECTOR1_CLIENT_SECRET:-}
      KEYCLOAK_URL: ${KEYCLOAK_URL:?set KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dataspace}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache bash curl jq >/dev/null
        cp /catalejo/federator/federate-catalogues.sh /tmp/federate.sh
        chmod +x /tmp/federate.sh
        while true; do
          echo "[catalejo] $$(date -u +%Y-%m-%dT%H:%M:%SZ) federating"
          /bin/bash /tmp/federate.sh || echo "[catalejo] federation failed"
          sleep "$${FEDERATION_INTERVAL_SECONDS}"
        done
